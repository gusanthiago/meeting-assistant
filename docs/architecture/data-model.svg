<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1042 712" width="1042" height="712" role="img" aria-labelledby="title desc">
  <title id="title">Data model</title>
  <desc id="desc">Data model. A workspace has many meetings. A meeting has one transcript, one summary and many action items, and every table carries workspace_id. River's job table lives in the same database and points at a meeting through args.meeting_id without a foreign key. A meeting's audio_key names an object in RustFS, and OpenSearch keeps a derived copy with one document per meeting.</desc>
