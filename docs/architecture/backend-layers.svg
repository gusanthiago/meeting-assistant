    .d-band { fill: #f6f8fa; stroke: #d5dbe1; stroke-width: 1px; }
    .d-band-label { fill: #586674; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: 0.06em; }
    .d-entity-head { fill: #e1f0f4; }
    .d-sep { fill: none; stroke: #8794a1; stroke-width: 1px; }
    .d-muted-box { fill: #ffffff; stroke: #8794a1; stroke-width: 1.25px; stroke-dasharray: 5 3; }
    .d-arrow { fill: none; stroke: #8794a1; stroke-width: 1.4px; }
    .d-arrow.acc { stroke: #0b6e88; stroke-width: 2px; }
    .d-arrow.ext { stroke: #a3600b; }
    .d-arrow.ret { stroke-dasharray: 5 4; }
