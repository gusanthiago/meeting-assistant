<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1252 612" width="1252" height="612" role="img" aria-labelledby="title desc">
  <title id="title">Backend layers</title>
  <desc id="desc">Backend layers. cmd/app reads the config and wires every layer. Entry points are the generated routes in api/gen, the HTTP handlers in api and the River workers. They call the application layer: internal/meeting for use cases and internal/jobs for pipeline steps, and use cases enqueue jobs. The application calls adapters, each behind an interface: store, storage, transcription, summary and search, which reach Postgres, RustFS, Whisper, the optional Claude API and OpenSearch. internal/domain holds statuses, rules and errors, is imported by every layer and imports nothing.</desc>
