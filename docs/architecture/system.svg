<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1252 542" width="1252" height="542" role="img" aria-labelledby="title desc">
  <title id="title">How the services connect</title>
  <desc id="desc">System overview. The browser loads the app from the web container and calls the Go API over REST. The API stores audio in RustFS, queries OpenSearch, and writes data and jobs to Postgres through PgBouncer. River workers in the same Go binary poll jobs through PgBouncer, read audio from RustFS, send it to the local Whisper service, call the Claude API outside Docker when configured, and index meetings in OpenSearch. Migrations connect to Postgres directly.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; stroke: #d5dbe1; stroke-width: 1px; }
    .d-box { fill: #ffffff; stroke: #8794a1; stroke-width: 1.25px; }
    .d-chip { fill: #f3f5f7; stroke: #cfd6dd; stroke-width: 1px; }
    .d-ext { fill: #fbf0e2; stroke: #a3600b; stroke-width: 1.25px; }
    .d-group { fill: none; stroke: #8794a1; stroke-width: 1.25px; stroke-dasharray: 6 5; }
    .d-frame { fill: none; stroke: #8794a1; stroke-width: 1px; }
    .d-frame-tab { fill: #f3f5f7; stroke: #8794a1; stroke-width: 1px; }
    .d-life { fill: none; stroke: #cfd6dd; stroke-width: 1px; stroke-dasharray: 3 4; }
    .d-arrow { fill: none; stroke: #8794a1; stroke-width: 1.4px; }
    .d-arrow.acc { stroke: #0b6e88; stroke-width: 2px; }
    .d-arrow.ext { stroke: #a3600b; }
    .d-arrow.ret { stroke-dasharray: 5 4; }
    .d-head { fill: #8794a1; }
    .d-head.acc { fill: #0b6e88; }
    .d-head.ext { fill: #a3600b; }
    .d-title { fill: #15202b; font-size: 13px; font-weight: 600; }
    .d-sub { fill: #586674; font-size: 11.5px; }
    .d-lbl { fill: #586674; font-size: 11px; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .d-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .d-tag { fill: #586674; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.04em; }
    .d-chip-text { fill: #15202b; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .d-pill { fill: #e1f0f4; stroke: #0b6e88; stroke-width: 1px; }
    .d-pill-text { fill: #0b6e88; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; }
    .d-pill.fail { fill: #ffffff; stroke: #b3261e; stroke-dasharray: 4 3; }
    .d-pill-text.fail { fill: #b3261e; }
  </style>
  <rect class="bg" x="-16" y="-16" width="1252" height="542" rx="12"/>

          <defs>
            <marker id="s-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="d-head" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="s-arr-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="d-head acc" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="s-arr-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="d-head ext" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>

          <rect class="d-group" x="250" y="24" width="940" height="396" rx="10"/>
          <text class="d-tag" x="266" y="46">docker compose</text>

          <rect class="d-box" x="16" y="200" width="120" height="60" rx="6"/>
          <text class="d-title" x="76" y="226" text-anchor="middle">Browser</text>
          <text class="d-sub" x="76" y="244" text-anchor="middle">React SPA</text>
          <path class="d-arrow" d="M76,200 V85 H279" marker-end="url(#s-arr)"/>
          <text class="d-lbl" x="165" y="77" text-anchor="middle">loads the app</text>
          <path class="d-arrow" d="M136,230 H279" marker-end="url(#s-arr)"/>
          <text class="d-lbl d-mono" x="193" y="222" text-anchor="middle">REST /v1</text>

