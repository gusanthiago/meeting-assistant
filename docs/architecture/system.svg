          <text class="d-lbl" x="760" y="255" text-anchor="middle">poll + write</text>

          <rect class="d-box" x="1030" y="198" width="150" height="54" rx="6"/>
          <text class="d-title" x="1105" y="221" text-anchor="middle">Whisper</text>
