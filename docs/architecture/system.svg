          <text class="d-lbl" x="638" y="307">pooled</text>

          <rect class="d-box" x="800" y="150" width="180" height="210" rx="6"/>
          <text class="d-title" x="890" y="176" text-anchor="middle">River workers</text>
          <text class="d-sub" x="890" y="194" text-anchor="middle">same binary as api</text>
          <rect class="d-chip" x="820" y="210" width="140" height="30" rx="4"/>
          <text class="d-chip-text" x="890" y="230" text-anchor="middle">transcribe</text>
          <rect class="d-chip" x="820" y="262" width="140" height="30" rx="4"/>
          <text class="d-chip-text" x="890" y="282" text-anchor="middle">summarize</text>
          <rect class="d-chip" x="820" y="314" width="140" height="30" rx="4"/>
          <text class="d-chip-text" x="890" y="334" text-anchor="middle">index_meeting</text>
