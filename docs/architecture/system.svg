          <text class="d-sub d-mono" x="370" y="245" text-anchor="middle">{code, status, data}</text>
          <text class="d-sub" x="370" y="262" text-anchor="middle">same binary as workers</text>

          <rect class="d-box" x="280" y="330" width="180" height="56" rx="6"/>
          <text class="d-title" x="370" y="354" text-anchor="middle">migrate</text>
          <text class="d-sub" x="370" y="371" text-anchor="middle">one-shot, retries until ready</text>

          <rect class="d-box" x="540" y="60" width="180" height="50" rx="6"/>
          <text class="d-title" x="630" y="81" text-anchor="middle">RustFS</text>
          <text class="d-sub" x="630" y="98" text-anchor="middle">S3 API · audio files</text>

