          <text class="d-title" x="630" y="196" text-anchor="middle">OpenSearch</text>
          <text class="d-sub" x="630" y="213" text-anchor="middle">derived search index</text>

          <rect class="d-box" x="540" y="240" width="180" height="44" rx="6"/>
          <text class="d-title" x="630" y="258" text-anchor="middle">PgBouncer</text>
          <text class="d-sub" x="630" y="275" text-anchor="middle">transaction pooling</text>

          <rect class="d-box" x="540" y="322" width="180" height="64" rx="6"/>
          <text class="d-title" x="630" y="348" text-anchor="middle">Postgres</text>
          <text class="d-sub" x="630" y="366" text-anchor="middle">data + River job queue</text>

