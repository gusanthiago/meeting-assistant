name: meeting-assistant

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: meeting-assistant-backend
  env_file: .env

services:
  postgres:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  pgbouncer:
    build: deploy/pgbouncer
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "6432"]
      interval: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
    ports: ["127.0.0.1:9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 40

  # MinIO no longer publishes images on Docker Hub; RustFS speaks the same S3 API.
  object-store:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - objdata:/data
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  migrate:
    <<: *backend
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      object-store: { condition: service_started }

  api:
    <<: *backend
    command: ["serve"]
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      whisper: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      retries: 20

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      - whispercache:/root/.cache
    # The first start downloads the model (~1.3 GB) before serving; the API waits for it,
    # so the first transcriptions don't burn their retries on a service that isn't up yet.
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20m
      start_interval: 5s

  web:
    build: web
    environment:
      API_PROXY_TARGET: http://api:8080
      VITE_POLLING: "true"
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts
      - ./api:/api:ro
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: { condition: service_started }

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.34.1
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./api:/spec:ro
    ports: ["127.0.0.1:8081:8080"]

  opensearch-dashboards:
    profiles: [debug]
    image: opensearchproject/opensearch-dashboards:3.8.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      opensearch: { condition: service_healthy }

  # Integration tests against the stack's Postgres, each in its own throwaway database: make test-integration
  backend-test:
    profiles: ["test"]
    image: golang:1.27.4-alpine3.24
    working_dir: /src
    env_file: .env
    environment:
      CGO_ENABLED: "0"
    volumes:
      - ./backend:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    depends_on:
      postgres: { condition: service_healthy }
    command: go test -tags integration -count=1 ./internal/...

volumes:
  pgdata:
  osdata:
  objdata:
  whispercache:
  gomod:
  gobuild:
